return`<div class="chart-area"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
${yLabels}
<line x1="${P}" y1="${goalY}" x2="${W-R}" y2="${goalY}" stroke="#e87f8f" stroke-dasharray="5 5"/>
<text x="${W-R+2}" y="${goalY+4}" font-size="9" fill="#e87f8f">55kg</text>
<path d="${mLine}" fill="none" stroke="#f4a0ab" stroke-width="2"/>
<path d="${eLine}" fill="none" stroke="#c8889e" stroke-width="2"/>
${dots}${labels}</svg></div>`}

function renderCalendar(){
const now=new Date(),yr=now.getFullYear(),mo=now.getMonth();
const fd=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate();
let cells="";
for(let i=0;i<fd;i++)cells+=`<div class="cal-cell"></div>`;
for(let d=1;d<=dim;d++){
const ds=`${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const c=taskCount(ds),isT=ds===today(),isF=ds>today();
const cls=`cal-cell${isT?" today":""}${isF?" future":""}`;
const badge=!isF&&c>0?(c===3?"⭐":c===2?"🔥":"·"):"";
cells+=`<div class="${cls}"><span class="cal-day">${d}</span>${badge?`<span class="cal-badge">${badge}</span>`:""}</div>`}
return cells}

function render(){
const p=phase(),tw=data.weights[today()]||{},lw=latestWeight(),prog=progress(),tv=todayVideo(),tt=tasks(),tc=taskCount(),afd=foodViewDate||today(),ivt=afd===today();
const app=document.getElementById("app");
app.innerHTML=`
<div class="header">
<div class="header-top"><div><h1 class="title">大美女养成计划</h1><p class="subtitle">第 ${weekNum()} 周 · Day ${daysSince()+1}</p></div><div class="target-badge"><span class="target-label">目标</span><span class="target-value">55kg</span></div></div>
<div><div class="progress-labels"><span>63kg</span><span class="progress-current">${lw}kg</span><span>55kg</span></div><div class="progress-track"><div class="progress-fill" style="width:${prog}%"><div class="progress-glow"></div></div></div><p class="progress-text">${prog>0?`已完成 ${prog.toFixed(0)}%，还差 ${(lw-55).toFixed(1)}kg`:"记录第一次体重开始你的旅程 ✨"}</p></div>
<div class="quote-box"><p class="quote-text">${quote}</p></div>
</div>

<div class="phase-bar" onclick="showPhase=!showPhase;render()"><div class="phase-info"><div class="phase-dot"></div><span class="phase-name">${p.name}</span><span class="phase-weeks">${p.weeks}</span></div><span class="phase-arrow">${showPhase?"▲":"▼"}</span></div>
<div class="phase-dropdown${showPhase?" open":""}">${PHASES.map(pp=>`<div class="phase-option${pp.id===data.currentPhase?" active":""}" onclick="data.currentPhase=${pp.id};showPhase=false;save();render()"><div class="phase-option-name">${pp.name} · ${pp.weeks}</div><div class="phase-option-desc">${pp.desc}</div></div>`).join("")}</div>

<div class="tabs">${[{id:"today",l:"今日计划"},{id:"weight",l:"体重记录"},{id:"food",l:"饮食记录"}].map(t=>`<button class="tab${tab===t.id?" active":""}" onclick="tab='${t.id}';render()">${t.l}</button>`).join("")}</div>

<div class="content">
${tab==="today"?`<div class="fade-in">
<div class="card"><h3 class="card-title">🏃‍♀️ 今日打卡 (${tc}/3)</h3>
<button class="task-btn ${tt.stairs?"done":"undone"}" onclick="toggleTask('stairs')"><span class="task-icon">${tt.stairs?"✅":"⬜"}</span><span>${p.stairs}</span></button>
<button class="task-btn ${tt.shoulder?"done":"undone"}" onclick="toggleTask('shoulder')"><span class="task-icon">${tt.shoulder?"✅":"⬜"}</span><span>肩颈训练 15min</span></button>
<button class="task-btn ${tt.video?"done":"undone"}" onclick="toggleTask('video')"><span class="task-icon">${tt.video?"✅":"⬜"}</span><span>跟练视频</span></button>
<div class="task-summary ${tc===3?"ts3":tc===2?"ts2":tc===1?"ts1":"ts0"}">${tc===3?"⭐ 今天全部完成了！大美女太棒了！":tc===2?"💪 完成了2/3，再加把劲！":tc===1?"🌱 迈出了第一步，继续加油～":"还没开始今天的运动哦～"}</div></div>

<div class="card"><h3 class="card-title">📅 ${new Date().getFullYear()}年${new Date().getMonth()+1}月 运动日历</h3>
<div class="cal-header">${["日","一","二","三","四","五","六"].map(d=>`<span>${d}</span>`).join("")}</div>
<div class="cal-grid">${renderCalendar()}</div>
<div class="cal-legend"><span class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#FFD700,#FFA500)"></span> 3/3 全勤</span><span class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#f7c5cc,#e8a0b4)"></span> 2/3 不错</span><span class="legend-item"><span class="legend-dot" style="background:#e0d0d3"></span> 1/3 加油</span></div></div>

<div class="card"><div class="daily-badge">💎 每日必做</div><h3 class="card-title" style="margin-top:8px">✨ 肩颈训练 · 直角肩+少女背</h3>
<a href="${DR.url}" target="_blank" class="video-link"><div class="video-card purple"><div class="video-play purple">▶</div><div><p class="video-title">${DR.title}</p><p class="video-hint">每天都要做！打造迷人肩颈线条 →</p></div></div></a></div>

<div class="card"><h3 class="card-title">📺 今日跟练视频</h3>
<a href="${tv.url}" target="_blank" class="video-link"><div class="video-card"><div class="video-play">▶</div><div><p class="video-title">${tv.title}</p><p class="video-hint">点击跳转B站跟练 →</p></div></div></a>
<p class="more-title">更多推荐：</p>${p.videos.filter(v=>v.url!==tv.url).map(v=>`<a href="${v.url}" target="_blank" class="more-link">${v.title}</a>`).join("")}</div>

<div class="card"><h3 class="card-title">📋 当前阶段说明</h3><div class="phase-detail"><span class="phase-detail-name">${p.name}</span><span class="phase-detail-weeks">${p.weeks}</span><p style="font-size:12px;color:#8a6a6e;margin:6px 0">${p.desc}</p><div class="phase-rules"><p>🔹 ${p.stairs}</p><p>🔹 ${p.videoTime}</p><p>🔹 进食窗口 12:00 - 18:30</p><p>🔹 奶茶每周 ≤ 2杯</p><p>🔹 姨妈期间可以休息，不要勉强自己 💕</p></div></div></div>
</div>`:""}

${tab==="weight"?`<div class="fade-in">
<div class="card"><h3 class="card-title">⚖️ 今日体重</h3>
<div class="weight-row"><span class="weight-label">🌅 早上</span>${tw.morning?`<span class="weight-recorded">${tw.morning} kg ✓</span>`:`<div class="weight-input-row"><input type="number" step="0.1" placeholder="0.0" class="weight-field" id="wm"><span class="weight-unit">kg</span><button class="weight-save" onclick="saveW('morning')">记录</button></div>`}</div>
<div class="weight-divider"></div>
<div class="weight-row"><span class="weight-label">🌙 晚上</span>${tw.evening?`<span class="weight-recorded">${tw.evening} kg ✓</span>`:`<div class="weight-input-row"><input type="number" step="0.1" placeholder="0.0" class="weight-field" id="we"><span class="weight-unit">kg</span><button class="weight-save" onclick="saveW('evening')">记录</button></div>`}</div></div>
<div class="card"><h3 class="card-title">📈 体重趋势</h3>${renderChart()}</div>
${Object.keys(data.weights).length?`<div class="card"><h3 class="card-title">📝 记录明细</h3>${Object.entries(data.weights).sort(([a],[b])=>b.localeCompare(a)).slice(0,14).map(([d,w])=>`<div class="history-item"><span class="history-date">${d.slice(5)}</span><span class="history-values">${w.morning?`早 ${w.morning}`:"—"} / ${w.evening?`晚 ${w.evening}`:"—"}</span></div>`).join("")}</div>`:""}
</div>`:""}

${tab==="food"?`<div class="fade-in">
<div class="card"><div class="food-date-nav"><button class="food-date-arrow" onclick="shiftDate(-1)">◀</button><div class="food-date-center"><span class="food-date-label">${fmtDate(afd)}</span><span class="food-date-full">${afd}</span></div><button class="food-date-arrow${ivt?" disabled":""}" onclick="shiftDate(1)">▶</button></div>${!ivt?`<button class="food-back" onclick="foodViewDate=null;render()">回到今天</button>`:""}</div>
<div class="card"><h3 class="card-title">🍽️ ${ivt?"今日":fmtDate(afd)}摄入</h3><div class="cal-summary"><span class="cal-big">${dateCal(afd)}</span><span class="cal-unit">kcal</span></div><p class="window-reminder">进食窗口：12:00 - 18:30</p></div>
${ivt?`<div class="card"><h3 class="card-title">✏️ 记录饮食</h3>
<div class="meal-types">
<button class="meal-type-btn${selectedMeal==="午餐"?" selected":""}" onclick="selectedMeal='午餐';render()"><span class="meal-type-icon">🍱</span>午餐</button>
<button class="meal-type-btn${selectedMeal==="晚餐"?" selected":""}" onclick="selectedMeal='晚餐';render()"><span class="meal-type-icon">🍲</span>晚餐</button>
<button class="meal-type-btn${selectedMeal==="饮品"?" selected":""}" onclick="selectedMeal='饮品';render()"><span class="meal-type-icon">🧋</span>饮品</button>
<button class="meal-type-btn${selectedMeal==="零食"?" selected":""}" onclick="selectedMeal='零食';render()"><span class="meal-type-icon">🍪</span>零食</button>
</div>
<div class="meal-row"><input type="time" class="meal-time-input" id="mt" value="${new Date().toTimeString().slice(0,5)}" style="flex:1"></div>
<div class="meal-row"><input type="text" placeholder="食物" class="food-name-input" id="fn"><input type="number" placeholder="卡路里" class="calorie-input" id="fc"><button class="add-btn" onclick="addFood()">+</button></div>
${foodItems.length?`<div class="result-box"><div class="result-header">已添加</div>${foodItems.map((f,i)=>`<div class="result-item"><span>${f.name}</span><div style="display:flex;align-items:center"><span class="result-cal">${f.calories} kcal</span><button class="remove-btn" onclick="foodItems.splice(${i},1);render()">×</button></div></div>`).join("")}<div class="result-total"><span>总计</span><span class="result-total-cal">${foodItems.reduce((s,f)=>s+f.calories,0)} kcal</span></div><button class="save-meal-btn" onclick="saveMeal()">✅ 保存这顿</button></div>`:""}</div>`:""
}
${(data.foods[afd]||[]).length?`<div class="card"><h3 class="card-title">📋 ${ivt?"今日":fmtDate(afd)}饮食时间线</h3>${data.foods[afd].map(e=>`<div class="food-entry"><div class="food-timeline"><div class="food-time-big">${e.time}</div><div class="food-timeline-line"></div><div class="food-time-content"><div class="food-entry-name">${e.name}</div>${(e.foods||[]).map(f=>`<div class="food-entry-item"><span>${f.name}</span><span class="result-cal">${f.calories} kcal</span></div>`).join("")}<div class="food-entry-total">小计：${e.total} kcal</div></div></div></div>`).join("")}</div>`:`<div class="card"><p class="empty-text">${ivt?"还没有记录，吃饭的时候问Claude卡路里吧 ✨":fmtDate(afd)+"没有饮食记录"}</p></div>`}
</div>`:""}
</div>

<div class="footer"><button class="reset-btn" onclick="resetAll()">重置所有数据</button></div>
`}

function toggleTask(t){if(!data.workouts[today()])data.workouts[today()]={};data.workouts[today()][t]=!data.workouts[today()][t];save();render()}
function saveW(t){const el=document.getElementById(t==="morning"?"wm":"we");const v=parseFloat(el.value);if(isNaN(v)||v<30||v>200)return;if(!data.weights[today()])data.weights[today()]={};data.weights[today()][t]=v;save();render()}
function addFood(){const fn=document.getElementById("fn"),fc=document.getElementById("fc");if(!fn.value||!fc.value)return;foodItems.push({name:fn.value,calories:parseInt(fc.value)});render()}
function saveMeal(){if(!foodItems.length)return;const mt=document.getElementById("mt");if(!data.foods[today()])data.foods[today()]=[];data.foods[today()].push({time:mt?.value||new Date().toTimeString().slice(0,5),foods:[...foodItems],total:foodItems.reduce((s,f)=>s+f.calories,0),name:selectedMeal||"一餐"});foodItems=[];selectedMeal="";save();render()}
function shiftDate(d){const dt=new Date(foodViewDate||today());dt.setDate(dt.getDate()+d);const iso=dt.toISOString().split("T")[0];if(iso>today())return;foodViewDate=iso===today()?null:iso;render()}
function resetAll(){if(confirm("确定要清除所有数据吗？")){data={startDate:today(),currentPhase:1,weights:{},foods:{},workouts:{}};save();render()}}

load();render();
</script>
</body>
</html>
